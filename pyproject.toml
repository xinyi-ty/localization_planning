[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localization-planning"
version = "0.1.0"
description = "Public-test planning and source localization for repository translation"
requires-python = ">=3.11"
dependencies = [
    "PyYAML==6.0.3",
    "python-dotenv==1.2.4",
    "torch==2.7.1",
    "transformers==4.57.6",
]

[tool.setuptools.packages.find]
include = ["localization*"]
